<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbz5_6OXxWfgneNng-nebgCw3DVFjambKs1cUuDHQ_cD4O-mB6PLp6wXf-2Ed4iBUFW-/exec";
const CART_KEY = "monety_svitu_cart";
const THEME_KEY = "monety_svitu_theme";

/* ================= DOM ================= */
const messageBox = document.getElementById("messageBox");
const coinPage = document.getElementById("coinPage");
const mainPhotoWrap = document.getElementById("mainPhotoWrap");
const mainPhoto = document.getElementById("mainPhoto");
const mainPhotoFallback = document.getElementById("mainPhotoFallback");
const thumbs = document.getElementById("thumbs");
const coinIdTop = document.getElementById("coinIdTop");
const statusBadge = document.getElementById("statusBadge");
const coinTitle = document.getElementById("coinTitle");
const coinPrice = document.getElementById("coinPrice");
const stockText = document.getElementById("stockText");
const stockQty = document.getElementById("stockQty");
const detailContinent = document.getElementById("detailContinent");
const detailCountry = document.getElementById("detailCountry");
const detailType = document.getElementById("detailType");
const detailNominalPeriod = document.getElementById("detailNominalPeriod");
const detailKM = document.getElementById("detailKM");
const detailMetal = document.getElementById("detailMetal");
const detailCondition = document.getElementById("detailCondition");
const detailTheme = document.getElementById("detailTheme");
const descriptionBlock = document.getElementById("descriptionBlock");
const descriptionText = document.getElementById("descriptionText");
const addToCartBtn = document.getElementById("addToCartBtn");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const lightboxClose = document.getElementById("lightboxClose");
const lightboxPrev = document.getElementById("lightboxPrev");
const lightboxNext = document.getElementById("lightboxNext");
const lightboxCounter = document.getElementById("lightboxCounter");
const cartCountBadge = document.getElementById("cartCountBadge");
const themeToggle = document.getElementById("themeToggle");

let currentCoin = null;
let gallery = [];
let currentPhotoIndex = 0;

/* ================= FIX ================= */

function setIfExists(el, value) {
  const clean = String(value || "").trim();
  if (clean) {
    el.textContent = clean;
    el.classList.remove("hidden");
    return true;
  } else {
    el.textContent = "";
    el.classList.add("hidden");
    return false;
  }
}

/* ================= THEME ================= */

function applyTheme(theme) {
  const normalized = theme === "dark" ? "dark" : "light";
  if (normalized === "dark") {
    document.body.setAttribute("data-theme", "dark");
    themeToggle.textContent = "☀";
  } else {
    document.body.removeAttribute("data-theme");
    themeToggle.textContent = "🌙";
  }
  localStorage.setItem(THEME_KEY, normalized);
}

function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  applyTheme(saved || "light");
}

function toggleTheme() {
  const current = document.body.getAttribute("data-theme") === "dark" ? "dark" : "light";
  applyTheme(current === "dark" ? "light" : "dark");
}

/* ================= CORE ================= */

function isSold(item) {
  return Number(item.Quantity || 0) <= 0;
}

function collectGallery(item) {
  return [
    item.PhotoMainURL,
    item.PhotoExtra1URL,
    item.PhotoExtra2URL,
    item.PhotoExtra3URL
  ].map(x => String(x || "").trim()).filter(x => x);
}

/* ================= RENDER ================= */

function renderCoin(item) {
  currentCoin = item;
  gallery = collectGallery(item);
  currentPhotoIndex = 0;

  const sold = isSold(item);
  const qty = Number(item.Quantity || 0);

  coinTitle.textContent = item.TitleUA || item.TitleEN || "Без назви";
  coinPrice.textContent = (item.PriceUAH || 0) + " грн";

  // ID
  if (item.ID) {
    coinIdTop.textContent = "ID: " + item.ID;
    coinIdTop.classList.remove("hidden");
  } else {
    coinIdTop.classList.add("hidden");
  }

  // Наявність
  if (sold) {
    stockText.textContent = "Немає в наявності";
    stockText.className = "stock-text sold";
    stockQty.classList.add("hidden");
  } else {
    stockText.textContent = "В наявності";
    stockText.className = "stock-text in-stock";

    if (qty > 0) {
      stockQty.textContent = "Кількість: " + qty + " шт";
      stockQty.classList.remove("hidden");
    } else {
      stockQty.classList.add("hidden");
    }
  }

  statusBadge.classList.toggle("hidden", !sold);

  // Деталі
  const fields = [
    [detailContinent, item.Continent],
    [detailCountry, item.Country],
    [detailType, item.Type],
    [detailNominalPeriod, item.NominalPeriod],
    [detailKM, item.KrauseNumber],
    [detailMetal, item.Metal],
    [detailCondition, item.Condition],
    [detailTheme, item.Theme],
  ];

  fields.forEach(([el, val]) => {
    const has = setIfExists(el, val);
    const label = el.previousElementSibling;
    if (label) label.classList.toggle("hidden", !has);
  });

  // Опис
  if (item.DescriptionUA && item.DescriptionUA.trim()) {
    descriptionText.textContent = item.DescriptionUA;
    descriptionBlock.classList.remove("hidden");
  } else {
    descriptionBlock.classList.add("hidden");
  }

  // Кнопка
  if (sold) {
    addToCartBtn.textContent = "Немає в наявності";
    addToCartBtn.className = "btn btn-disabled";
    addToCartBtn.disabled = true;
  } else {
    addToCartBtn.textContent = "Додати в кошик";
    addToCartBtn.className = "btn";
    addToCartBtn.disabled = false;
  }

  renderThumbs();
  setMainPhoto(0);

  messageBox.classList.add("hidden");
  coinPage.classList.remove("hidden");
}

/* ================= LOAD ================= */

async function loadCoin() {
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");
  const id = params.get("id");

  let url = GAS_URL + "?action=getCoin";
  if (slug) url += "&slug=" + slug;
  if (id) url += "&id=" + id;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (!data.success || !data.item) throw new Error();

    renderCoin(data.item);
  } catch {
    messageBox.textContent = "Помилка завантаження";
  }
}

/* ================= INIT ================= */

addToCartBtn.addEventListener("click", () => {
  if (!currentCoin || isSold(currentCoin)) return;
  const cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
  cart.push({ title: currentCoin.TitleUA, price: currentCoin.PriceUAH });
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  cartCountBadge.textContent = cart.length;
});

themeToggle.addEventListener("click", toggleTheme);

initTheme();
loadCoin();
</script>
