<!-- ВСТАВ СЮДИ СВІЙ HTML БЕЗ ЗМІН ДО <script> -->

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbz5_6OXxWfgneNng-nebgCw3DVFjambKs1cUuDHQ_cD4O-mB6PLp6wXf-2Ed4iBUFW-/exec";
const CART_KEY = "monety_svitu_cart";

/* ===================== ДОПОМІЖНІ ===================== */

function setIfExists(valueEl, labelEl, value) {
  const clean = String(value || "").trim();

  if (clean) {
    valueEl.textContent = clean;
    valueEl.classList.remove("hidden");
    labelEl.classList.remove("hidden");
    return true;
  } else {
    valueEl.textContent = "";
    valueEl.classList.add("hidden");
    labelEl.classList.add("hidden");
    return false;
  }
}

function isSold(item) {
  return Number(item.Quantity || 0) <= 0;
}

function collectGallery(item) {
  const arr = [
    item.PhotoMainURL,
    item.PhotoExtra1URL,
    item.PhotoExtra2URL,
    item.PhotoExtra3URL
  ];
  return arr.map(x => String(x || "").trim()).filter(x => x);
}

/* ===================== ОСНОВНИЙ РЕНДЕР ===================== */

function renderCoin(item) {
  const sold = isSold(item);
  const qty = Number(item.Quantity || 0);

  // Назва і ціна
  coinTitle.textContent = item.TitleUA || item.TitleEN || "Без назви";
  coinPrice.textContent = (item.PriceUAH || 0) + " грн";

  // ID
  if (item.ID) {
    coinIdTop.textContent = "ID: " + item.ID;
    coinIdTop.classList.remove("hidden");
  } else {
    coinIdTop.classList.add("hidden");
  }

  // Наявність
  if (sold) {
    stockText.textContent = "Немає в наявності";
    stockText.className = "stock-text sold";
    stockQty.classList.add("hidden");
  } else {
    stockText.textContent = "В наявності";
    stockText.className = "stock-text in-stock";

    if (qty > 0) {
      stockQty.textContent = "Кількість: " + qty + " шт";
      stockQty.classList.remove("hidden");
    } else {
      stockQty.classList.add("hidden");
    }
  }

  statusBadge.classList.toggle("hidden", !sold);

  /* ===== ДЕТАЛІ ===== */

  const labels = document.querySelectorAll(".details-label");
  const values = document.querySelectorAll(".details-value");

  setIfExists(values[0], labels[0], item.Continent);
  setIfExists(values[1], labels[1], item.Country);
  setIfExists(values[2], labels[2], item.Type);
  setIfExists(values[3], labels[3], item.NominalPeriod);
  setIfExists(values[4], labels[4], item.KrauseNumber);
  setIfExists(values[5], labels[5], item.Metal);
  setIfExists(values[6], labels[6], item.Condition);
  setIfExists(values[7], labels[7], item.Theme);

  /* ===== ОПИС ===== */

  if (item.DescriptionUA && item.DescriptionUA.trim()) {
    descriptionText.textContent = item.DescriptionUA;
    descriptionBlock.classList.remove("hidden");
  } else {
    descriptionBlock.classList.add("hidden");
  }

  /* ===== КНОПКА ===== */

  if (sold) {
    addToCartBtn.textContent = "Немає в наявності";
    addToCartBtn.className = "btn btn-disabled";
    addToCartBtn.disabled = true;
  } else {
    addToCartBtn.textContent = "Додати в кошик";
    addToCartBtn.className = "btn";
    addToCartBtn.disabled = false;
  }

  /* ===== ГАЛЕРЕЯ ===== */

  const gallery = collectGallery(item);

  if (!gallery.length) {
    mainPhoto.classList.add("hidden");
    mainPhotoFallback.classList.remove("hidden");
  } else {
    mainPhoto.src = gallery[0];
    mainPhoto.classList.remove("hidden");
    mainPhotoFallback.classList.add("hidden");
  }

  /* ===== ФІНАЛ ===== */

  messageBox.classList.add("hidden");
  coinPage.classList.remove("hidden");
}

/* ===================== ЗАВАНТАЖЕННЯ ===================== */

async function loadCoin() {
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");
  const id = params.get("id");

  let url = GAS_URL + "?action=getCoin";
  if (slug) url += "&slug=" + slug;
  if (id) url += "&id=" + id;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (!data.success || !data.item) {
      throw new Error("Монету не знайдено");
    }

    renderCoin(data.item);
  } catch (e) {
    messageBox.textContent = "Помилка завантаження";
  }
}

loadCoin();
</script>
