<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Монета</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      width: min(1100px, calc(100% - 24px));
      margin: 0 auto;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
    }

    .back-link,
    .cart-link {
      text-decoration: none;
      color: #2563eb;
      font-weight: 700;
    }

    .page {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 22px;
      margin-bottom: 30px;
    }

    .gallery,
    .details {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 16px;
    }

    .main-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f9fafb;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .main-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .thumb {
      border: 1px solid #d1d5db;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      background: #fff;
      padding: 0;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .coin-type {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: #6b7280;
      letter-spacing: 0.04em;
    }

    .coin-title {
      margin: 0 0 14px;
      font-size: 30px;
      line-height: 1.25;
      font-weight: 800;
    }

    .coin-page-stock {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      padding: 9px 12px;
      border-radius: 999px;
      background: #166534;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }

    .coin-page-stock.low {
      background: #b45309;
    }

    .coin-details-meta {
      display: grid;
      gap: 8px;
      margin: 12px 0 16px;
    }

    .coin-details-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 15px;
      line-height: 1.4;
    }

    .coin-details-label {
      min-width: 90px;
      font-weight: 700;
      color: #6b7280;
    }

    .coin-details-value {
      font-weight: 600;
      color: #111827;
    }

    .coin-description {
      margin: 14px 0;
      font-size: 15px;
      line-height: 1.55;
      color: #374151;
      white-space: pre-line;
    }

    .price-box {
      margin: 18px 0;
      font-size: 32px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 16px;
      min-height: 46px;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-light {
      background: #eef2ff;
      color: #1e3a8a;
    }

    .error-box {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      color: #6b7280;
    }

    @media (max-width: 900px) {
      .page {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="back-link" href="index.html">← До каталогу</a>
      <a class="cart-link" href="cart.html">🛒 Кошик <span id="cartCounter">(0)</span></a>
    </div>
  </header>

  <main class="container">
    <div id="coinContainer" class="error-box">Завантаження...</div>
  </main>

  <script>
    const GAS_URL = "ВСТАВ_СЮДИ_СВІЙ_GAS_WEB_APP_URL";

    function safeNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function buildUrl(params = {}) {
      const url = new URL(GAS_URL);
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== "") {
          url.searchParams.set(key, value);
        }
      });
      return url.toString();
    }

    async function fetchJson(params = {}) {
      const response = await fetch(buildUrl(params), {
        method: "GET",
        cache: "no-store"
      });

      const text = await response.text();

      try {
        return JSON.parse(text);
      } catch (error) {
        console.error("Invalid JSON:", text);
        throw new Error("Сервер повернув не JSON");
      }
    }

    function updateCartCounter() {
      const cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const totalQty = cart.reduce((sum, item) => sum + safeNumber(item.qty), 0);
      document.getElementById("cartCounter").textContent = `(${totalQty})`;
    }

    function getTypeLabel(coin) {
      return coin.Type === "Монета за типом" ? "Монета за типом" : "Монета";
    }

    function getStockClass(qty) {
      return qty <= 2 ? "coin-page-stock low" : "coin-page-stock";
    }

    function getSlugFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("slug") || "";
    }

    function setMainImage(src) {
      const mainImage = document.getElementById("mainCoinImage");
      if (mainImage) mainImage.src = src;
    }

    function addToCart(coin) {
      const availableQty = safeNumber(coin.Quantity);
      if (availableQty <= 0) {
        alert("Цієї монети зараз немає в наявності.");
        return;
      }

      let cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const existing = cart.find(item => String(item.ID) === String(coin.ID));

      if (existing) {
        const nextQty = safeNumber(existing.qty) + 1;
        if (nextQty > availableQty) {
          alert(`Доступно лише ${availableQty} шт.`);
          return;
        }
        existing.qty = nextQty;
        existing.availableQty = availableQty;
      } else {
        cart.push({
          ID: coin.ID,
          TitleUA: coin.TitleUA || "",
          PriceUAH: safeNumber(coin.PriceUAH),
          PhotoMainURL: coin.PhotoMainURL || "",
          qty: 1,
          availableQty: availableQty
        });
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartCounter();
    }

    function renderCoin(coin) {
      const container = document.getElementById("coinContainer");
      document.title = `${coin.TitleUA || "Монета"} — Монети Світу`;

      const qty = safeNumber(coin.Quantity);
      const typeLabel = escapeHtml(getTypeLabel(coin));
      const title = escapeHtml(coin.TitleUA || "");
      const description = escapeHtml(coin.Description || "");
      const period = escapeHtml(coin.NominalPeriod || "");
      const km = escapeHtml(coin.KrauseNumber || "");
      const condition = escapeHtml(coin.Condition || "");
      const country = escapeHtml(coin.Country || "");
      const metal = escapeHtml(coin.Metal || "");
      const theme = escapeHtml(coin.Theme || "");
      const price = safeNumber(coin.PriceUAH);

      const images = [
        coin.PhotoMainURL,
        coin.PhotoExtra1URL,
        coin.PhotoExtra2URL,
        coin.PhotoExtra3URL
      ].filter(Boolean);

      const mainImage = escapeHtml(images[0] || "");

      container.className = "page";
      container.innerHTML = `
        <section class="gallery">
          <div class="main-image-wrap">
            <img id="mainCoinImage" class="main-image" src="${mainImage}" alt="${title}">
          </div>

          ${images.length > 1 ? `
            <div class="thumbs">
              ${images.map(url => `
                <button class="thumb" onclick="setMainImage('${String(url).replaceAll("'", "\\'")}')">
                  <img src="${escapeHtml(url)}" alt="${title}">
                </button>
              `).join("")}
            </div>
          ` : ""}
        </section>

        <section class="details">
          <div class="coin-type">${typeLabel}</div>
          <h1 class="coin-title">${title}</h1>

          ${qty > 0 ? `<div class="${getStockClass(qty)}">В наявності: ${qty}</div>` : ""}

          <div class="coin-details-meta">
            ${country ? `
              <div class="coin-details-row">
                <div class="coin-details-label">Країна:</div>
                <div class="coin-details-value">${country}</div>
              </div>
            ` : ""}

            ${period ? `
              <div class="coin-details-row">
                <div class="coin-details-label">Період:</div>
                <div class="coin-details-value">${period}</div>
              </div>
            ` : ""}

            ${km ? `
              <div class="coin-details-row">
                <div class="coin-details-label">KM#:</div>
                <div class="coin-details-value">${km}</div>
              </div>
            ` : ""}

            ${condition ? `
              <div class="coin-details-row">
                <div class="coin-details-label">Стан:</div>
                <div class="coin-details-value">${condition}</div>
              </div>
            ` : ""}

            ${metal ? `
              <div class="coin-details-row">
                <div class="coin-details-label">Метал:</div>
                <div class="coin-details-value">${metal}</div>
              </div>
            ` : ""}

            ${theme ? `
              <div class="coin-details-row">
                <div class="coin-details-label">Тема:</div>
                <div class="coin-details-value">${theme}</div>
              </div>
            ` : ""}
          </div>

          ${description ? `<div class="coin-description">${description}</div>` : ""}

          <div class="price-box">${price} грн</div>

          <div class="actions">
            <button class="btn btn-primary" id="addToCartBtn">Додати в кошик</button>
            <a href="cart.html" class="btn btn-light" style="text-decoration:none;display:inline-flex;align-items:center;">Перейти в кошик</a>
          </div>
        </section>
      `;

      document.getElementById("addToCartBtn").addEventListener("click", () => addToCart(coin));
    }

    async function incrementCoinViews(slug) {
      try {
        await fetch(buildUrl({ action: "incrementViews", slug }), {
          method: "GET",
          cache: "no-store"
        });
      } catch (error) {
        console.error("Views increment error:", error);
      }
    }

    async function loadCoin() {
      const slug = getSlugFromUrl();
      if (!slug) {
        throw new Error("Не вказаний slug");
      }

      const data = await fetchJson({ action: "getCoin", slug });
      const coin = data?.coin || data;

      if (!coin || !coin.ID) {
        throw new Error("Монету не знайдено");
      }

      renderCoin(coin);
      incrementCoinViews(slug);
    }

    updateCartCounter();

    loadCoin().catch(error => {
      console.error(error);
      const container = document.getElementById("coinContainer");
      container.className = "error-box";
      container.innerHTML = "Не вдалося завантажити сторінку монети.";
    });
  </script>
</body>
</html>
