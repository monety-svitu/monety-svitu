<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Монети Світу</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { margin: 0 0 10px; }
    .muted { color:#777; font-size: 12px; }

    .topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 10px; }
    .topActions { display:flex; gap:8px; align-items:center; }

    #welcomeBox {
      border: 1px solid #eee;
      background: #fafafa;
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0 14px;
      display: none;
    }
    #welcomeText { white-space: pre-wrap; line-height: 1.35; }

    #filters { display:flex; gap:10px; flex-wrap:wrap; margin: 10px 0 15px; }
    #filters input, #filters select, #filters button { padding: 6px 8px; font-size: 14px; }
    #filters button { cursor:pointer; }

    #coins {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .coin {
      border:1px solid #ddd;
      padding:12px;
      border-radius:10px;
      background:#fff;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height: 100%;
    }

    .coinMedia {
      width: 100%;
    }

    .coinGalleryTop {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .coinImgBox {
      border: 1px solid #eee;
      border-radius: 10px;
      background: #fafafa;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display:flex;
      align-items:center;
      justify-content:center;
      position: relative;
    }

    .coinImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display:block;
      background:#fff;
      cursor: pointer;
    }

    .coinImageLink {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
    }

    .coinNoImage {
      color:#999;
      font-size:12px;
      text-align:center;
      padding: 10px;
    }

    .coinMoreBar {
      margin-top: 8px;
      display: flex;
      justify-content: center;
    }

    .coinToggleBtn {
      border: 1px solid #ddd;
      background: #f7f7f7;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .coinExtraWrap {
      margin-top: 8px;
      display: none;
    }

    .coinExtraWrap.open {
      display: block;
    }

    .coinExtraViewer {
      border: 1px solid #eee;
      border-radius: 10px;
      background: #fafafa;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coinBody {
      min-width: 0;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .coinTitle {
      font-weight: 800;
      font-size: 18px;
      margin: 0;
      line-height: 1.2;
    }

    .coinTitleLink {
      color: inherit;
      text-decoration: none;
    }

    .coinTitleLink:hover {
      text-decoration: underline;
    }

    .coinMeta {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .coinRow {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .pill {
      display:inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background:#f2f2f2;
      font-size: 12px;
    }

    .price { font-weight: 900; font-size: 18px; }
    .btn { padding: 6px 10px; cursor:pointer; }
    .btnAdd { background:#111; color:#fff; border:0; border-radius: 8px; }
    .btnAdd[disabled] { opacity:0.5; cursor:not-allowed; }
    .empty { padding: 20px; border: 1px dashed #ccc; border-radius: 10px; }

    #cartFab {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 0;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #cartBadge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: #f0c040;
      color: #111;
      font-size: 12px;
      font-weight: 900;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid #111;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      z-index: 1100;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(440px, 94vw);
      background: #fff;
      border-left: 1px solid #ddd;
      transform: translateX(110%);
      transition: transform 0.2s ease;
      z-index: 1200;
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }

    .drawerHeader {
      padding: 14px;
      border-bottom: 1px solid #eee;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
    }
    .drawerHeader h3 { margin: 0; }
    .closeBtn { border: 0; background: transparent; font-size: 22px; cursor: pointer; line-height: 1; }

    .drawerBody { padding: 14px; overflow: auto; flex: 1; }
    .drawerFooter { border-top: 1px solid #eee; padding: 14px; background: #fafafa; }

    .cartItem { border: 1px solid #eee; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
    .cartItemTop { display:flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .cartItemTitle { font-weight: 800; font-size: 14px; line-height: 1.2; }
    .cartItemMeta { font-size: 12px; color:#666; margin-top: 4px; }
    .qtyRow { display:flex; align-items:center; gap: 8px; margin-top: 10px; }
    .qtyBtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid #ddd; background: #f7f7f7; cursor: pointer; font-size: 18px; }
    .qtyNum { min-width: 28px; text-align:center; font-weight: 900; }
    .removeBtn { border: 0; background: transparent; cursor: pointer; color: #b00020; font-weight: 700; }

    .totalRow { display:flex; justify-content: space-between; font-weight: 900; margin-bottom: 10px; }

    .formGrid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
    .formGrid input, .formGrid textarea {
      padding: 10px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px;
    }

    .btnPrimary { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: #f0c040; font-weight: 900; cursor: pointer; }
    .btnPrimary:disabled { opacity: 0.5; cursor: not-allowed; }

    .hint { font-size: 12px; color:#666; margin-top: 6px; }
    .error { font-size: 12px; color:#b00020; margin-top: 6px; }

    .viberPill {
      display:inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background:#efeaff;
      font-weight: 900;
      font-size: 12px;
      color:#3a2a8a;
      border:1px solid #e2dcff;
    }

    @media (max-width: 520px) {
      #coins {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <h1 style="margin:0;">Монети Світу</h1>
      <div class="muted">Пошук по назві та Krause (KM#...).</div>
    </div>
    <div class="topActions"></div>
  </div>

  <div id="welcomeBox">
    <div id="welcomeText"></div>
  </div>

  <div id="filters">
    <input id="q" type="text" placeholder="Пошук: назва, KM#..." />
    <select id="fCountry"><option value="">Всі країни</option></select>
    <select id="fMetal"><option value="">Всі метали</option></select>
    <select id="fCondition"><option value="">Будь-який стан</option></select>
    <select id="sort">
      <option value="new">Нові (як у списку)</option>
      <option value="price_asc">Ціна ↑</option>
      <option value="price_desc">Ціна ↓</option>
      <option value="title_asc">Назва A→Я</option>
    </select>
    <label style="display:flex;align-items:center;gap:6px;">
      <input id="onlyInStock" type="checkbox" checked />
      Тільки в наявності
    </label>
    <button id="reset">Скинути</button>
  </div>

  <div id="coins"></div>

  <button id="cartFab" title="Кошик">🛒<span id="cartBadge">0</span></button>

  <div id="overlay"></div>

  <div class="drawer" id="cartDrawer">
    <div class="drawerHeader">
      <h3>Кошик</h3>
      <button class="closeBtn" id="closeDrawer">✕</button>
    </div>

    <div class="drawerBody">
      <div id="cartList"></div>

      <div id="checkoutError" class="error"></div>

      <div class="formGrid">
        <div class="viberPill">Зв’язок: тільки Viber</div>

        <input id="cName" placeholder="Ім'я *">
        <input id="cPhone" placeholder="Телефон *">
        <input id="cEmail" placeholder="Email (необов’язково)">
        <textarea id="cComment" placeholder="Коментар (необов’язково)" rows="3"></textarea>

        <button class="btnPrimary" id="btnOrder" disabled>Замовити</button>
        <div class="hint">* — обов’язкові поля. Ми напишемо вам у Viber для уточнень.</div>
        <div id="checkoutMsg" class="hint"></div>
      </div>
    </div>

    <div class="drawerFooter">
      <div class="totalRow">
        <div>Разом</div>
        <div id="cartTotal">0 грн</div>
      </div>
    </div>
  </div>

<script>
  const API_COINS = "/api/coins";
  const API_ORDER = "/api/order";
  const API_SETTINGS = "/api/settings";
  const NO_IMAGE = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><rect width='100%25' height='100%25' fill='%23f7f7f7'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='%23999' font-family='Arial' font-size='28'>Немає фото</text></svg>";

  let allCoins = [];
  let viewCoins = [];
  let cartMap = {};

  function norm(v){ return String(v ?? "").toLowerCase().trim(); }
  function uniq(arr){ return [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b), "uk")); }
  function money(n){ const x = Number(n) || 0; return Math.round(x); }

  function uuid_() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function escHtml(v) {
    return String(v ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function getCoinHref(coin) {
    const slug = String(coin?.Slug || coin?.ID || "").trim();
    return "/coin.html?slug=" + encodeURIComponent(slug);
  }

  async function loadWelcome() {
    try {
      const r = await fetch(API_SETTINGS);
      if (!r.ok) return;
      const t = await r.text();
      const s = JSON.parse(t);
      const text = String((s && s.welcome_text) || "").trim();
      if (!text) return;
      document.getElementById("welcomeText").textContent = text;
      document.getElementById("welcomeBox").style.display = "block";
    } catch (e) {
      console.log("welcome load failed:", e);
    }
  }

  function cartCount() {
    return Object.values(cartMap).reduce((s, it) => s + (it.qty || 0), 0);
  }

  function cartTotal() {
    return Object.values(cartMap).reduce((s, it) => s + money(it.coin.PriceUAH) * (it.qty || 0), 0);
  }

  function updateCartBadge() {
    const n = cartCount();
    const badge = document.getElementById("cartBadge");
    badge.textContent = String(n);
    badge.style.display = n > 0 ? "flex" : "none";
    document.getElementById("cartTotal").textContent = cartTotal() + " грн";
    validateCheckout();
  }

  function openDrawer() {
    document.getElementById("overlay").style.display = "block";
    document.getElementById("cartDrawer").classList.add("open");
    renderCart();
  }

  function closeDrawer() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("cartDrawer").classList.remove("open");
  }

  document.getElementById("cartFab").addEventListener("click", openDrawer);
  document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
  document.getElementById("overlay").addEventListener("click", closeDrawer);

  async function loadCoins() {
    try {
      const res = await fetch(API_COINS);
      const text = await res.text();

      if (text.trim().startsWith("<")) {
        console.error("Coins API returned HTML:", text.slice(0, 400));
        alert("Помилка: /api/coins повернув HTML (не JSON). Відкрий F12 → Console.");
        return;
      }

      allCoins = JSON.parse(text);
      fillFilterOptions();
      applyFilters();
    } catch (e) {
      console.error("loadCoins error:", e);
      alert("Помилка завантаження монет. Відкрий F12 → Console.");
    }
  }

  function fillFilterOptions() {
    const country = document.getElementById("fCountry");
    const metal = document.getElementById("fMetal");
    const cond = document.getElementById("fCondition");

    country.innerHTML = `<option value="">Всі країни</option>`;
    metal.innerHTML = `<option value="">Всі метали</option>`;
    cond.innerHTML = `<option value="">Будь-який стан</option>`;

    uniq(allCoins.map(c => c.Country)).forEach(v => {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = v;
      country.appendChild(o);
    });

    uniq(allCoins.map(c => c.Metal)).forEach(v => {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = v;
      metal.appendChild(o);
    });

    uniq(allCoins.map(c => c.Condition)).forEach(v => {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = v;
      cond.appendChild(o);
    });
  }

  function applyFilters() {
    const q = norm(document.getElementById("q").value);
    const fCountry = document.getElementById("fCountry").value;
    const fMetal = document.getElementById("fMetal").value;
    const fCondition = document.getElementById("fCondition").value;
    const onlyInStock = document.getElementById("onlyInStock").checked;
    const sort = document.getElementById("sort").value;

    viewCoins = allCoins.filter(c => {
      if (onlyInStock && Number(c.Quantity) <= 0) return false;
      if (fCountry && c.Country !== fCountry) return false;
      if (fMetal && c.Metal !== fMetal) return false;
      if (fCondition && c.Condition !== fCondition) return false;

      if (q) {
        const hay = [c.TitleUA, c.TitleEN, c.KrauseNumber, c.Country, c.Metal, c.Theme, c.Condition]
          .map(norm)
          .join(" ");
        if (!hay.includes(q)) return false;
      }

      return true;
    });

    if (sort === "price_asc") viewCoins.sort((a,b)=> money(a.PriceUAH)-money(b.PriceUAH));
    if (sort === "price_desc") viewCoins.sort((a,b)=> money(b.PriceUAH)-money(a.PriceUAH));
    if (sort === "title_asc") viewCoins.sort((a,b)=> String(a.TitleUA||"").localeCompare(String(b.TitleUA||""), "uk"));

    renderCoins();
  }

  function renderCoins() {
    const container = document.getElementById("coins");
    container.innerHTML = "";

    if (!viewCoins.length) {
      container.innerHTML = `<div class="empty">Нічого не знайдено</div>`;
      return;
    }

    viewCoins.forEach(c => {
      const inStock = Number(c.Quantity) > 0;

      const mainUrl = String(c.PhotoMainURL || "").trim();
      const extra1Url = String(c.PhotoExtra1URL || "").trim();
      const extra2Url = String(c.PhotoExtra2URL || "").trim();

      const top1 = mainUrl || NO_IMAGE;
      const top2 = extra1Url || NO_IMAGE;

      const coinHref = getCoinHref(c);
      const coinId = String(c.ID);
      const hasExtraThird = !!extra2Url;

      const div = document.createElement("div");
      div.className = "coin";
      div.innerHTML = `
        <div class="coinMedia">
          <div class="coinGalleryTop">
            <div class="coinImgBox">
              <a class="coinImageLink" href="${escHtml(coinHref)}">
                <img
                  class="coinImage"
                  src="${escHtml(top1)}"
                  alt="${escHtml((c.TitleUA || "Монета") + " фото 1")}"
                  loading="lazy"
                  onerror="this.onerror=null;this.src='${NO_IMAGE}'"
                />
              </a>
            </div>

            <div class="coinImgBox">
              <a class="coinImageLink" href="${escHtml(coinHref)}">
                <img
                  class="coinImage"
                  src="${escHtml(top2)}"
                  alt="${escHtml((c.TitleUA || "Монета") + " фото 2")}"
                  loading="lazy"
                  onerror="this.onerror=null;this.src='${NO_IMAGE}'"
                />
              </a>
            </div>
          </div>

          ${
            hasExtraThird ? `
              <div class="coinMoreBar">
                <button class="coinToggleBtn" onclick="toggleExtraPhotos('${escHtml(coinId)}')">
                  Показати ще фото
                </button>
              </div>

              <div class="coinExtraWrap" id="extraWrap_${escHtml(coinId)}">
                <div class="coinExtraViewer">
                  <img
                    class="coinImage"
                    src="${escHtml(extra2Url)}"
                    alt="${escHtml((c.TitleUA || "Монета") + " фото 3")}"
                    loading="lazy"
                    onerror="this.onerror=null;this.src='${NO_IMAGE}'"
                  />
                </div>
              </div>
            ` : ``
          }
        </div>

        <div class="coinBody">
          <div class="coinTitle">
            <a class="coinTitleLink" href="${escHtml(coinHref)}">
              ${escHtml(c.TitleUA || "")}
            </a>
          </div>

          <div class="coinMeta">
            ${c.Country ? `<span class="pill">${escHtml(c.Country)}</span>` : ""}
            ${c.Metal ? `<span class="pill">${escHtml(c.Metal)}</span>` : ""}
            ${c.Condition ? `<span class="pill">${escHtml(c.Condition)}</span>` : ""}
            ${c.KrauseNumber ? `<span class="pill">${escHtml(c.KrauseNumber)}</span>` : ""}
          </div>

          <div class="coinRow">
            <div class="price">${money(c.PriceUAH)} грн</div>
            <button class="btn btnAdd" ${inStock ? "" : "disabled"} onclick="addToCart('${escHtml(coinId)}')">Покласти в кошик</button>
          </div>
        </div>
      `;

      container.appendChild(div);
    });
  }

  function toggleExtraPhotos(coinId) {
    const wrap = document.getElementById("extraWrap_" + coinId);
    if (!wrap) return;
    wrap.classList.toggle("open");
  }

  function addToCart(id) {
    const coin = allCoins.find(x => String(x.ID) === String(id));
    if (!coin) return;

    const key = String(coin.ID);
    if (!cartMap[key]) cartMap[key] = { coin, qty: 0 };

    const maxQty = Number(coin.Quantity) || 0;
    if (cartMap[key].qty < maxQty) cartMap[key].qty += 1;

    updateCartBadge();
  }

  function incQty(id) {
    const it = cartMap[String(id)];
    if (!it) return;
    const maxQty = Number(it.coin.Quantity) || 0;
    if (it.qty < maxQty) it.qty += 1;
    renderCart();
  }

  function decQty(id) {
    const it = cartMap[String(id)];
    if (!it) return;
    it.qty -= 1;
    if (it.qty <= 0) delete cartMap[String(id)];
    renderCart();
  }

  function removeItem(id) {
    delete cartMap[String(id)];
    renderCart();
  }

  function renderCart() {
    const list = document.getElementById("cartList");
    list.innerHTML = "";

    const items = Object.values(cartMap);
    if (items.length === 0) {
      list.innerHTML = `<div class="muted">Кошик пустий</div>`;
      updateCartBadge();
      return;
    }

    items.forEach(({coin, qty}) => {
      const div = document.createElement("div");
      div.className = "cartItem";
      div.innerHTML = `
        <div class="cartItemTop">
          <div style="flex:1">
            <div class="cartItemTitle">${escHtml(coin.TitleUA || "Монета")}</div>
            <div class="cartItemMeta">${money(coin.PriceUAH)} грн за 1 шт</div>
          </div>
          <button class="removeBtn" onclick="removeItem('${escHtml(coin.ID)}')">Видалити</button>
        </div>
        <div class="qtyRow">
          <button class="qtyBtn" onclick="decQty('${escHtml(coin.ID)}')">−</button>
          <div class="qtyNum">${qty}</div>
          <button class="qtyBtn" onclick="incQty('${escHtml(coin.ID)}')">+</button>
          <div style="margin-left:auto;font-weight:900">${money(coin.PriceUAH) * qty} грн</div>
        </div>
      `;
      list.appendChild(div);
    });

    updateCartBadge();
  }

  ["cName","cPhone","cEmail","cComment"].forEach(id=>{
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("input", validateCheckout);
    el.addEventListener("change", validateCheckout);
  });

  function validateCheckout() {
    const hasItems = cartCount() > 0;
    const name = document.getElementById("cName").value.trim();
    const phone = document.getElementById("cPhone").value.trim();
    document.getElementById("btnOrder").disabled = !(hasItems && name && phone);
  }

  document.getElementById("btnOrder").addEventListener("click", checkout);

  async function checkout() {
    const msg = document.getElementById("checkoutMsg");
    const err = document.getElementById("checkoutError");
    const btn = document.getElementById("btnOrder");

    msg.textContent = "";
    err.textContent = "";

    if (btn.dataset.locked === "1") return;
    btn.dataset.locked = "1";
    btn.disabled = true;

    try {
      if (cartCount() === 0) { err.textContent = "Кошик пустий"; return; }

      const name = document.getElementById("cName").value.trim();
      const phone = document.getElementById("cPhone").value.trim();
      const email = document.getElementById("cEmail").value.trim();
      const comment = document.getElementById("cComment").value.trim();

      if (!name || !phone) { err.textContent = "Заповни: ім'я і телефон"; return; }

      const items = [];
      Object.values(cartMap).forEach(({ coin, qty }) => {
        for (let i=0; i<qty; i++) items.push({ ID: coin.ID });
      });

      msg.textContent = "Відправляю замовлення...";

      const payload = {
        name,
        phone,
        email: email || "",
        comment: comment || "",
        channel: "Viber",
        items,
        totalUAH: cartTotal(),
        clientOrderId: uuid_()
      };

      const r = await fetch(API_ORDER, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const text = await r.text();
      let resp; try { resp = JSON.parse(text); } catch { resp = { raw: text }; }

      if (r.ok && resp && (resp.success === true || resp.orderId)) {
        alert("Замовлення прийнято! Ми напишемо вам у Viber для уточнень.");
        cartMap = {};
        renderCart();
        closeDrawer();
        await loadCoins();
        msg.textContent = "";
      } else {
        console.log("Order not OK:", r.status, resp);
        err.textContent = (resp && resp.error) ? resp.error : "Помилка створення замовлення. Дивись F12 → Console.";
      }

    } catch (e) {
      console.log("checkout error:", e);
      err.textContent = "Помилка мережі. Дивись F12 → Console.";
    } finally {
      btn.dataset.locked = "0";
      validateCheckout();
    }
  }

  document.getElementById("q").addEventListener("input", applyFilters);
  document.getElementById("fCountry").addEventListener("change", applyFilters);
  document.getElementById("fMetal").addEventListener("change", applyFilters);
  document.getElementById("fCondition").addEventListener("change", applyFilters);
  document.getElementById("onlyInStock").addEventListener("change", applyFilters);
  document.getElementById("sort").addEventListener("change", applyFilters);

  document.getElementById("reset").addEventListener("click", () => {
    document.getElementById("q").value = "";
    document.getElementById("fCountry").value = "";
    document.getElementById("fMetal").value = "";
    document.getElementById("fCondition").value = "";
    document.getElementById("sort").value = "new";
    document.getElementById("onlyInStock").checked = true;
    applyFilters();
  });

  updateCartBadge();
  loadWelcome();
  loadCoins();
</script>
</body>
</html>
