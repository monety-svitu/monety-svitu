<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кошик — Монети Світу</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      width: min(1100px, calc(100% - 24px));
      margin: 0 auto;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
    }

    .back-link {
      text-decoration: none;
      color: #2563eb;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    .box {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 16px;
    }

    .box h2 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 12px;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 0;
      align-items: center;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-thumb {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      overflow: hidden;
      background: #f9fafb;
    }

    .cart-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cart-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .cart-price,
    .cart-stock,
    .cart-sum {
      font-size: 14px;
      color: #374151;
      margin: 4px 0;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .qty-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 10px;
      background: #e5edff;
      color: #1e3a8a;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .qty-input {
      width: 70px;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .remove-btn {
      border: none;
      border-radius: 10px;
      background: #fee2e2;
      color: #991b1b;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 15px;
    }

    .summary-row:last-child {
      border-bottom: none;
      padding-top: 14px;
      font-size: 20px;
      font-weight: 800;
    }

    .form-grid {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .form-grid input,
    .form-grid textarea,
    .form-grid select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #fff;
      font-size: 14px;
    }

    .form-grid textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 16px;
      min-height: 46px;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
      width: 100%;
      margin-top: 14px;
    }

    .empty-box {
      text-align: center;
      color: #6b7280;
      padding: 24px 0;
    }

    .note {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.45;
      margin-top: 10px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .cart-item {
        grid-template-columns: 1fr;
      }

      .cart-thumb {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="back-link" href="index.html">← Продовжити вибір монет</a>
      <div><strong>Кошик</strong></div>
    </div>
  </header>

  <main class="container">
    <div class="layout">
      <section class="box">
        <h2>Ваші монети</h2>
        <div id="cartItems"></div>
      </section>

      <section class="box">
        <h2>Оформлення замовлення</h2>

        <div id="summaryBox">
          <div class="summary-row"><span>Кількість позицій</span><strong id="itemsCount">0</strong></div>
          <div class="summary-row"><span>Загальна кількість</span><strong id="coinsCount">0</strong></div>
          <div class="summary-row"><span>Разом</span><strong id="totalPrice">0 грн</strong></div>
        </div>

        <div class="form-grid">
          <input type="text" id="lastName" placeholder="Прізвище *" required>
          <input type="text" id="firstName" placeholder="Ім’я">
          <input type="text" id="phone" placeholder="Телефон">
          <textarea id="comment" placeholder="Коментар до замовлення"></textarea>
        </div>

        <button class="btn btn-primary" onclick="submitOrder()">Підтвердити замовлення</button>

        <div class="note">
          Прізвище є обов’язковим. Кількість у кошику не може перевищувати доступну наявність.
        </div>
      </section>
    </div>
  </main>

  <script>
    const GAS_URL = "ВСТАВ_СЮДИ_СВІЙ_GAS_WEB_APP_URL";

    let allCoins = [];

    function safeNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function buildUrl(params = {}) {
      const url = new URL(GAS_URL);
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== "") {
          url.searchParams.set(key, value);
        }
      });
      return url.toString();
    }

    async function fetchJson(params = {}) {
      const response = await fetch(buildUrl(params), {
        method: "GET",
        cache: "no-store"
      });

      const text = await response.text();

      try {
        return JSON.parse(text);
      } catch (error) {
        console.error("Invalid JSON:", text);
        throw new Error("Сервер повернув не JSON");
      }
    }

    function getCart() {
      return JSON.parse(localStorage.getItem("cart") || "[]");
    }

    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    async function loadCoins() {
      const data = await fetchJson({ action: "getCoins" });
      allCoins = Array.isArray(data?.coins) ? data.coins : Array.isArray(data) ? data : [];
    }

    function syncCartWithStock() {
      let cart = getCart();

      cart = cart
        .map(item => {
          const coin = allCoins.find(c => String(c.ID) === String(item.ID));
          if (!coin) return null;

          const availableQty = safeNumber(coin.Quantity);
          if (availableQty <= 0) return null;

          return {
            ...item,
            TitleUA: coin.TitleUA || item.TitleUA || "",
            PriceUAH: safeNumber(coin.PriceUAH || item.PriceUAH),
            PhotoMainURL: coin.PhotoMainURL || item.PhotoMainURL || "",
            availableQty,
            qty: Math.min(Math.max(1, safeNumber(item.qty || 1)), availableQty)
          };
        })
        .filter(Boolean);

      saveCart(cart);
      return cart;
    }

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById("cartItems");

      if (!cart.length) {
        container.innerHTML = `<div class="empty-box">Кошик порожній.</div>`;
        updateSummary(cart);
        return;
      }

      container.innerHTML = cart.map(item => {
        const itemPrice = safeNumber(item.PriceUAH);
        const itemQty = safeNumber(item.qty);
        const itemAvailable = safeNumber(item.availableQty);

        return `
          <div class="cart-item">
            <div class="cart-thumb">
              <img src="${escapeHtml(item.PhotoMainURL || "")}" alt="${escapeHtml(item.TitleUA || "")}">
            </div>

            <div>
              <div class="cart-title">${escapeHtml(item.TitleUA || "")}</div>
              <div class="cart-price">Ціна: ${itemPrice} грн</div>
              <div class="cart-stock">В наявності: ${itemAvailable}</div>
              <div class="cart-sum">Сума: ${itemPrice * itemQty} грн</div>

              <div class="qty-row">
                <button class="qty-btn" onclick="decreaseCartQty('${escapeHtml(item.ID)}')">−</button>

                <input
                  class="qty-input"
                  type="number"
                  min="1"
                  max="${itemAvailable || 1}"
                  value="${itemQty}"
                  onchange="changeCartQty('${escapeHtml(item.ID)}', this.value)"
                >

                <button class="qty-btn" onclick="increaseCartQty('${escapeHtml(item.ID)}')">+</button>
              </div>
            </div>

            <div>
              <button class="remove-btn" onclick="removeFromCart('${escapeHtml(item.ID)}')">Видалити</button>
            </div>
          </div>
        `;
      }).join("");

      updateSummary(cart);
    }

    function updateSummary(cart) {
      const itemsCount = cart.length;
      const coinsCount = cart.reduce((sum, item) => sum + safeNumber(item.qty), 0);
      const totalPrice = cart.reduce((sum, item) => sum + safeNumber(item.qty) * safeNumber(item.PriceUAH), 0);

      document.getElementById("itemsCount").textContent = itemsCount;
      document.getElementById("coinsCount").textContent = coinsCount;
      document.getElementById("totalPrice").textContent = `${totalPrice} грн`;
    }

    function changeCartQty(coinId, value) {
      let cart = getCart();
      const item = cart.find(x => String(x.ID) === String(coinId));
      if (!item) return;

      const maxQty = safeNumber(item.availableQty || 1);
      let qty = safeNumber(value || 1);

      if (!qty || qty < 1) qty = 1;
      if (qty > maxQty) {
        qty = maxQty;
        alert(`Доступно лише ${maxQty} шт.`);
      }

      item.qty = qty;
      saveCart(cart);
      renderCart();
    }

    function increaseCartQty(coinId) {
      let cart = getCart();
      const item = cart.find(x => String(x.ID) === String(coinId));
      if (!item) return;

      const maxQty = safeNumber(item.availableQty || 1);
      const currentQty = safeNumber(item.qty || 1);

      if (currentQty >= maxQty) {
        alert(`Доступно лише ${maxQty} шт.`);
        return;
      }

      item.qty = currentQty + 1;
      saveCart(cart);
      renderCart();
    }

    function decreaseCartQty(coinId) {
      let cart = getCart();
      const item = cart.find(x => String(x.ID) === String(coinId));
      if (!item) return;

      const currentQty = safeNumber(item.qty || 1);
      item.qty = Math.max(1, currentQty - 1);

      saveCart(cart);
      renderCart();
    }

    function removeFromCart(coinId) {
      let cart = getCart();
      cart = cart.filter(item => String(item.ID) !== String(coinId));
      saveCart(cart);
      renderCart();
    }

    function buildOrderItemsText(cart) {
      return cart.map(item => {
        const qty = safeNumber(item.qty);
        const price = safeNumber(item.PriceUAH);
        const sum = qty * price;
        return `${item.ID}. ${item.TitleUA}, ${price} грн, ${qty} шт., ${sum} грн`;
      }).join("\n");
    }

    async function submitOrder() {
      const cart = getCart();

      if (!cart.length) {
        alert("Кошик порожній.");
        return;
      }

      const lastName = document.getElementById("lastName").value.trim();
      const firstName = document.getElementById("firstName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const comment = document.getElementById("comment").value.trim();

      if (!lastName) {
        alert("Вкажіть прізвище.");
        document.getElementById("lastName").focus();
        return;
      }

      const orderData = {
        action: "createOrder",
        lastName,
        firstName,
        phone,
        comment,
        itemsText: buildOrderItemsText(cart),
        items: JSON.stringify(cart.map(item => ({
          id: item.ID,
          qty: safeNumber(item.qty)
        })))
      };

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: new URLSearchParams(orderData)
        });

        const text = await response.text();

        let data;
        try {
          data = JSON.parse(text);
        } catch (error) {
          console.error(text);
          throw new Error("Сервер повернув некоректну відповідь");
        }

        if (!data?.success) {
          throw new Error(data?.error || "Не вдалося створити замовлення");
        }

        localStorage.removeItem("cart");
        window.location.href = "success.html";
      } catch (error) {
        console.error(error);
        alert(error.message || "Помилка при створенні замовлення.");
      }
    }

    async function init() {
      await loadCoins();
      syncCartWithStock();
      renderCart();
    }

    init().catch(error => {
      console.error(error);
      document.getElementById("cartItems").innerHTML =
        `<div class="empty-box">Не вдалося завантажити кошик.</div>`;
    });
  </script>
</body>
</html>
